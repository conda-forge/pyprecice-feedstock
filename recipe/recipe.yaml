schema_version: 1

context:
  name: pyprecice
  version: "3.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyprecice-${{ version }}.tar.gz
  sha256: 1778bfc8a586693331e99d5a57a62c4f9ed8d6f6f4b56ef158e9a27cc46eac0b

build:
  number: 0
  skip:
    - win
    - match(python, "<3.12")
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
  host:
    - cython
    - numpy
    - packaging
    - setuptools
    - pip
    - precice
    - python
    - pkgconfig
  run:
    - mpi4py
    - numpy
    - python
    - cython

tests:
  - requirements:
      run:
        - pip
    script:
      - export OMPI_MCA_plm=isolated
      - export OMPI_MCA_rmaps_base_oversubscribe=yes
      - export OMPI_MCA_btl_vader_single_copy_mechanism=none
      - python -c "import precice"
      - pip check

about:
  license: LGPL-3.0-or-later
  license_file: LICENSE.txt
  summary: Python language bindings for preCICE
  description: |
    This package provides python language bindings for the C++ library
    preCICE.
  homepage: https://precice.org
  repository: https://github.com/precice/python-bindings
  documentation: https://precice.org/installation-bindings-python.html

extra:
  recipe-maintainers:
    - IshaanDesai
    - jan-janssen
